[package]
name = "contextcall-core"
version.workspace = true
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# keyring: platform backend features are target-gated below (a single shared
# `keyring = "3"` would compile the non-persistent mock store). Do NOT add a
# featureless keyring here — it would pull the dbus backend onto macOS/Windows.
futures = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
whisper-rs = "0.14"
cpal = "0.15"
rubato = "0.15"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio-stream = "0.1"
realfft = "3"
num-complex = "0.4"
hound = "3.5"
sysinfo = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Persistent OS credential store per platform (keyring v3 backends are opt-in).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
